        <style>
            *{
                box-sizing:border-box;
                margin:0;
                padding:0;
            }
            body{
                & nav{
                    display:flex;
                    width:100dvw;
                    height:4vh;
                    margin-top:10dvh;
                    align-items:center;
                    justify-content:center;
                    gap:5dvw;
                    & input{

                        background-color:#1e5631;
                        color:white;

                    }
                    & input:hover{
                        cursor:pointer;
                    }
                }
                & h2:nth-of-type(1){
                    position:absolute;
                    left:50%;
                    bottom:57dvh;
                    transform:translate(-50%,0%);
                }
                & #Imagen{
                    position:absolute;
                    width:70dvw;
                    height:12dvh;
                    left:50%;
                    bottom:63dvh;
                    border:2px solid black;
                    border-radius:10px;
                    transform:translate(-50%,0%);
                    & #tablaImagen{
                        display:grid;
                        grid-template-rows:repeat(2,1fr);
                        position:absolute;
                        width:90%;
                        height:15%;
                        top:10%;
                        left:50%;
                        transform:translate(-50%,0%);
                        font-size:1.3rem;
                        & #trPosicion,& #trValor{
                            display:flex;
                            align-items:center;
                            & p{
                                width:6dvw;
                                border:1px solid black;
                                padding-top:1dvh;
                                padding-bottom:1dvh;
                                text-align:center;
                                font-weight:700;
                            }
                            & .celda{
                                display:flex;
                                width:6dvw;
                                padding-top:1dvh;
                                padding-right:2dvw;
                                padding-left:2dvw;
                                padding-bottom:1dvh;
                                border:1px solid black;
                                align-items:center;
                                justify-content:center;
                                overflow:hidden;
                            }
                        }
                    }
                }
                & #Salida{
                    position:absolute;
                    width:70dvw;
                    height:12dvh;
                    left:50%;
                    bottom:44dvh;
                    border:2px solid black;
                    padding-top:10px;
                    padding-left:30px;
                    padding-bottom:30px;
                    border-radius:10px;
                    line-height:25px;
                    transform:translate(-50%,0%);
                    font-family:Verdana,Geneva,Tahoma,sans-serif;
                    overflow-y:scroll;
                }
                & #Pregunta{
                    position:absolute;
                    width:20dvw;
                    height:20dvh;
                    background-color:#F7DF1E;
                    border:1px solid black;
                    padding-top:20px;
                    top:50%;
                    left:50%;
                    border-radius:10px;
                    text-align:center;
                    font-weight:700;
                    font-size:1.3rem;
                    transform:translate(-50%,-50%);
                    & #Datos{
                        position:absolute;
                        width:80%;
                        height:18%;
                        top:40%;
                        left:50%;
                        border-radius:10px;
                        font-size:1.2rem;
                        transform:translate(-50%,-50%);
                    }
                    & #Continuar{
                        position:absolute;
                        width:60%;
                        height:18%;
                        background-color:lime;
                        top:75%;
                        left:50%;
                        border-radius:10px;
                        transform:translate(-50%,0%);
                    }
                    & #Error{
                        position:absolute;
                        width:100%;
                        color:red;
                        top:55%;
                        left:50%;
                        transform:translate(-50%,0%);
                    }
                }
                #tablaBotones{
                    position:absolute;
                    width:85dvw;
                    height:30dvh;
                    top:57%;
                    left:50%;
                    transform:translate(-50%,0%);
                    & #Botones{
                        width:60dvw;
                        & tr td:nth-of-type(2){
                            width:15%;
                        }
                        & tr td:nth-of-type(3){
                            gap:10px
                        }
                        & input{
                            height:100%;
                            margin-right:2px;
                            border-radius:10px;
                            font-size:1.2rem;
                        }
                        & .Obligatorio{
                            background-color:yellow;
                        }
                        & .Opcional{
                            background-color:white;
                        }
                        & .Error{
                            width:35%;
                            color:red;
                        }
                    }
                }
                .Invisible{
                    display:none;
                }
                .Visible{
                    display:block;
                }
                .Boton{
                    width:100%;
                    height:100%;
                    background-color:#1e5631;
                    color:white;
                    border-radius:10px;
                    font-weight:900;
                }
                .Boton:hover{
                    cursor:pointer;
                }
            }
        </style>
    </head>
    <body id="Cuerpo">
        <header class="cabecera-principal">
            <div class="contenido-cabecera">
                <div class="identidad">
                    <div class="logo-iniciales">ÓS</div>
                    <h1>Óscar Pozuelo Villamandos</h1>
                </div>  
                <div class="curso-badge">
                    DWEC
                </div>
            </div>
        </header>
        <nav>
            <input type="button" value="ARRAYS" id="Arrays">
            <input type="button" value="CONJUNTOS" id="Conjuntos">
            <input type="button" value="MAPAS" id="Mapas">
        </nav>
        <div id="Imagen" class="Invisible">
            <div id="tablaImagen">
                <div id="trPosicion">
                    <p>POSICIÓN</p>
                </div>
                <div id="trValor">
                    <p>VALOR</p>
                </div>
            </div>
        </div>
        <h2 id="h2Salida" class="Invisible">SALIDA:</h2>
        <div id="Salida" class="Invisible"></div>
        <table id="tablaBotones">
            <tbody id="Botones"></tbody>
        </table>
        <footer class="pie-pagina">
            <div class="contenido-footer">
                <div class="texto-legal">
                    <p>2025-26 IES LOS SAUCES. ©Todos los derechos reservados.</p>
                    <p class="autor"><a href="https://oscarpozvil.ieslossauces.es">Óscar Pozuelo Villamandos.</a> Fecha de Actualización: 23-02-2026</p>
                </div>
                <div class="iconos-footer">
                    <a href="https://github.com/SrPozuelo/OPVDWECProyectoDWEC" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="../../indexProyectoDWEC.html" title="Inicio"><i class="fa-solid fa-house"></i></a> 
                </div>
            </div>
        </footer>
        <script>
            function LimpiarPantalla(){
                Arrai=new Array();
                Conjunto=new Set();
                Mapa=new Map();
                Imagen.setAttribute("class","Invisible");
                Salida.setAttribute("class","Invisible");
                h2Salida.setAttribute("class","Invisible");
                while(Botones.getElementsByTagName("tr").length!=0){
                    Botones.removeChild(Botones.getElementsByTagName("tr")[0]);
                }
            }
            function BorrarInput(name){
                for(input of document.getElementsByName(name)){
                    input.value="";
                }
            }
            function BorrarError(metodo){
                const Err=document.getElementsByClassName(metodo)[0];
                const span=document.getElementById(("span"+metodo));
                if(span!=null){
                    Err.removeChild(span);
                }
                
            }
            function AgregarSalida(texto){
                const Sal=document.getElementById("Salida");
                texto=document.createTextNode(texto);
                Sal.appendChild(texto);
                Sal.appendChild(document.createElement("br"));
            }
            function AgregarError(metodo,mensaje){
                const Err=document.getElementsByClassName(metodo)[0];
                const span=document.createElement("span");
                span.setAttribute("id","span"+metodo);
                span.textContent=mensaje;
                Err.appendChild(span);
            }
            function accionPush(){
                const inputs=document.getElementsByName("PUSH")[0].value;
                let correcto=true,mensaje;
                BorrarError("PUSH");
                if(inputs=="" && correcto){
                    correcto=false;
                    mensaje="No debes dejar los campos en amarillo vacios.";
                }
                if(!correcto){
                    AgregarError("PUSH",mensaje);
                }
                else{
                    Arrai.push(inputs);
                    DibujarArray();
                    BorrarInput("PUSH");
                }
            }
            function accionPop(){
                let correcto=true,mensaje;
                BorrarError("POP");
                if(Arrai.length==0 && correcto){
                    mensaje="No se puede eliminar más elementos del array.";
                    correcto=false;
                }
                if(!correcto){
                    AgregarError("POP",mensaje);
                }
                else{
                    AgregarSalida("[POP]-Se eliminó el elemento '"+Arrai[(Arrai.length-1)]+"'.");
                    Arrai.pop();
                    DibujarArray();
                }
            }
            function accionShift(){
                let correcto=true,mensaje;
                BorrarError("SHIFT");
                if(Arrai.length==0 && correcto){
                    mensaje="No se puede eliminar más elementos del array.";
                    correcto=false;
                }
                if(!correcto){
                    AgregarError("SHIFT",mensaje);
                }
                else{
                    AgregarSalida("[SHIFT]-Se eliminó el elemento '"+Arrai[0]+"'.");
                    Arrai.shift();
                    DibujarArray();
                }
            }
            function accionUnshift(){
                let inputs=document.getElementsByName("UNSHIFT")[0].value;
                let correcto=true,mensaje;
                BorrarError("UNSHIFT");
                if(inputs=="" && correcto){
                    correcto=false;
                    mensaje="No debes dejar los campos en amarillo vacios.";
                }
                if(!correcto){
                    AgregarError("UNSHIFT",mensaje);
                }
                else{
                    Arrai.unshift(inputs);
                    DibujarArray();
                    BorrarInput("UNSHIFT");
                }
            }
            function accionIncludes(){
                let elemento=document.getElementsByName("INCLUDES")[0].value;
                let posicion=document.getElementsByName("INCLUDES")[1].value;
                let correcto=true,mensaje;
                BorrarError("INCLUDES");
                if(elemento=="" && correcto){
                    correcto=false;
                    mensaje="No debes dejar los campos en amarillo vacios.";
                }
                if(!correcto){
                    AgregarError("INCLUDES",mensaje);
                }
                else{
                    if(Arrai.includes(elemento,posicion)){
                        AgregarSalida("[INCLUDES]-El elemento '"+elemento+"' está en el array.");
                    }
                    else{
                        AgregarSalida("[INCLUDES]-El elemento '"+elemento+"' no está en el array");
                    }
                    BorrarInput("INCLUDES");
                }
            }
            function accionReverse(){
                Arrai.reverse();
                DibujarArray();
            }
            function accionSlice(){
                let posIni=document.getElementsByName("SLICE")[0].value;
                let posFin=document.getElementsByName("SLICE")[1].value;
                BorrarError("SLICE");
                let correcto=true,copia,mensaje="NULL",sonEnteros=true;
                if(posIni==""){
                    posIni=undefined;
                    sonEnteros=false;
                }
                else{
                    if(isNaN(posIni) ||(!isNaN(posIni) && posIni.includes("."))){
                        correcto=false;
                        sonEnteros=false;
                        mensaje="El primer campo debe ser un numero entero.";
                    }
                }
                if(posFin==""){
                    posFin=undefined;
                    sonEnteros=false;
                }
                else{
                    if(isNaN(posFin) || (!isNaN(posFin) && posFin.includes("."))){
                        correcto=false;
                        sonEnteros=false;
                        mensaje="El segundo campo debe ser un numero entero.";
                    }
                }
                if(correcto && sonEnteros){
                    if(Number(posIni)>=Number(posFin)){
                        correcto=false;
                        mensaje="El valor del primer campo debe ser menor que el del segundo campo.";
                    }
                }
                if(correcto && Number(posIni)>=Arrai.length){
                    correcto=false;
                    mensaje="El primero campo debe tener un valor menor, no hay tantos elementos.";
                }
                if(correcto && Number(posFin)>Arrai.length){
                    correcto=false;
                    mensaje="El segundo campo debe tener un valor menor, no hay tantos elementos.";
                }
                if(!correcto){
                    AgregarError("SLICE",mensaje);
                }
                else{
                    copia=Arrai.slice(posIni,posFin);
                    AgregarSalida("[SLICE]-Los elementos copiados son "+copia+".");
                }
                BorrarInput("SLICE");
            }
            function accionSplice(){
                let posicion=document.getElementsByName("SPLICE")[0].value;
                let eliminados=document.getElementsByName("SPLICE")[1].value;
                let anadidos=document.getElementsByName("SPLICE")[2].value.split(",");
                let mensaje,correcto=true,A="";
                BorrarError("SPLICE");
                eliminados=="" ? eliminados=undefined:null;
                  anadidos=="" ?   anadidos=undefined:null;
                if(posicion=="" && correcto){
                    correcto=false;
                    mensaje="No debes dejar los campos en amarillo vacios.";
                }
                if((isNaN(Number(posicion)) || (!isNaN(Number(posicion)) && posicion.includes("."))) && correcto){
                    correcto=false;
                    mensaje="El primer campo debe ser un numero entero.";
                }
                if(eliminados!=undefined && correcto){
                    if(isNaN(Number(eliminados)) ||(!isNaN(Number(eliminados)) && posicion.includes("."))){
                        correcto=false;
                        mensaje="El segundo campo debe ser un numero entero.";
                    }
                }
                if(!correcto){
                    AgregarError("SPLICE",mensaje);
                }
                else{
                    if(eliminados==undefined){
                        if(anadidos!=undefined){
                            for(elemento of anadidos){
                                Arrai.splice(posicion,eliminados,elemento);
                                posicion=posicion+1;
                            }
                        }
                        else{
                            Arrai.splice(posicion,eliminados,undefined);
                        }
                    }
                    else{
                        AgregarSalida("[SPLICE]-Los elementos eliminados son "+Arrai.splice(posicion,eliminados,undefined)+".");
                    }
                    if(anadidos!=undefined){
                        for(elemento of anadidos){
                            Arrai.splice(posicion,undefined,elemento);
                            posicion=posicion+1;
                        }
                    }
                }
                DibujarArray();
                BorrarInput("SPLICE");
            }
            function DibujarArray(){
                const trPosicion=document.getElementById("trPosicion");
                const trValor=document.getElementById("trValor");
                trPosicion.innerHTML="<p>POSICIÓN</p>";
                trValor.innerHTML="<p>VALOR</p>";
                let posicion;
                for(let i=0;i<Arrai.length;i++){
                    posicion=document.createElement("div");
                    posicion.setAttribute("class","celda");
                    posicion.textContent=i;
                    trPosicion.appendChild(posicion);
                }
                for(let i=0;i<Arrai.length;i++){
                    posicion=document.createElement("div");
                    posicion.setAttribute("class","celda");
                    posicion.textContent=Arrai[i];
                    trValor.appendChild(posicion);
                }
            }
            function PeticionDeDatos(pregunta,estructura){
                const Cuerpo=document.getElementById("Cuerpo");
                const div=document.createElement("div");
                let input=document.createElement("input");
                div.textContent=pregunta;
                div.setAttribute("id","Pregunta");
                input.setAttribute("type","text");
                input.setAttribute("id","Datos");
                div.appendChild(input);
                input=document.createElement("input");
                input.setAttribute("type","button");
                input.setAttribute("value","CONTINUAR");
                input.setAttribute("id","Continuar");
                input.addEventListener("click",()=>{
                    if((document.getElementById("Datos").value)==""){
                        if(document.getElementById("Error")!=null){
                            Cuerpo.removeChild(input);
                        }
                        input=document.createElement("p");
                        input.setAttribute("id","Error");
                        input.textContent="No debes dejar el campo vacio.";
                        div.appendChild(input);                 
                    }
                    else{
                        boton=true;
                        switch(estructura){
                            case "Array":
                                Arrai.push(document.getElementById("Datos").value);
                                Cuerpo.removeChild(div);
                                Imagen.setAttribute("class","Visible");
                                Salida.setAttribute("class","Visible");
                                h2Salida.setAttribute("class","Visible");
                                DibujarArray();
                                let Nombres=[
                                    ["PUSH"    ,1,accionPush    ,[true]             ],
                                    ["POP"     ,0,accionPop     ,[]                 ],
                                    ["SHIFT"   ,0,accionShift   ,[]                 ],
                                    ["UNSHIFT" ,1,accionUnshift ,[true]             ],
                                    ["INCLUDES",2,accionIncludes,[true ,false]      ],
                                    ["REVERSE" ,0,accionReverse ,[]                 ],
                                    ["SLICE"   ,2,accionSlice   ,[false,false]      ],
                                    ["SPLICE"  ,3,accionSplice  ,[true ,false,false]]
                                ];
                                let bot,tr,input,td;
                                for(metodo of Nombres){
                                    tr=document.createElement("tr");
                                    td=document.createElement("td");
                                    bot=document.createElement("button");
                                    bot.setAttribute("id",metodo[0]);
                                    bot.textContent=metodo[0];
                                    bot.setAttribute("class","Boton");
                                    td.setAttribute("class","Error "+metodo[0]);
                                    tr.appendChild(td);
                                    td=document.createElement("td");
                                    td.appendChild(bot);
                                    tr.appendChild(td);
                                    td=document.createElement("td");
                                    for(let i=0;i<metodo[1];i++){
                                        input=document.createElement("input");
                                        input.type="text";
                                        input.name=metodo[0];
                                        td.appendChild(input);
                                    }
                                    tr.appendChild(td);
                                    Botones.appendChild(tr);
                                    let cont=0;
                                    for(inp of document.getElementsByName(metodo[0])){
                                        if(metodo[3][cont]){
                                            inp.setAttribute("class","Obligatorio");
                                        }
                                        else{
                                            inp.setAttribute("class","Opcional");
                                        }
                                        cont=cont+1;
                                    }
                                    document.getElementById(metodo[0]).addEventListener("click",metodo[2]);
                                }
                            break;
                            case "Conjunto":break;
                            case "Mapa":break;
                        }
                    }
                });
                div.appendChild(input);
                Cuerpo.appendChild(div);
            }
            const Arrays=document.getElementById("Arrays");
            const Conjuntos=document.getElementById("Conjuntos");
            const Mapas=document.getElementById("Mapas");
            const Imagen=document.getElementById("Imagen");
            const Botones=document.getElementById("Botones");
            const Salida=document.getElementById("Salida");
            const h2Salida=document.getElementById("h2Salida");
            var boton=true;
            var Arrai=new Array();
            var Conjunto=new Set();
            var Mapa=new Map();
            Arrays.addEventListener("click",()=>{
                LimpiarPantalla();
                if(boton){
                    boton=false;
                    PeticionDeDatos("Introduzca el primer valor del Array:","Array");
                    console.log(Arrai);
                }
            });
            Conjuntos.addEventListener("click",()=>{
                LimpiarPantalla();
                if(boton){
                    boton=false;
                }
            });
            Mapas.addEventListener("click",()=>{
                LimpiarPantalla();
                if(boton){
                    boton=false;
                }
            });
        </script>
    </body>
