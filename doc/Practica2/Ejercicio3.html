<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="../../webroot/css/estilos.css" rel="stylesheet" type="text/css" />
        <title>EJERCICIO 3</title>
    </head>
    <body>
        <script>
            'use stricted'
            function repeticion(listado){
                var mapa=new Map(),cont;
                for(const palabra1 in listado){
                    cont=0;
                    for(const palabra2 in listado){
                        if(listado[palabra1]==listado[palabra2]){
                            cont=cont+1;
                        }
                    }
                    mapa.set(listado[palabra1],cont);
                }
                return mapa;
            }
            var palabra,pregunta,repetido,listado=new Array();
            mapa=new Map();
            palabra=prompt("Introduzca una palabra (Pulsa el botón de cancelar o no introduzca nada para terminar):");
            while(isNaN(Number(palabra))){
                if(!isNaN(Number(palabra))){
                    pregunta="Debes introducir una palabra, introdúzcalo de nuevo: ";
                }
                else{
                    pregunta="Introduzca una palabra (Pulsa el botón de cancelar o no introduzca nada para terminar):";
                    listado.push(palabra);
                }
                palabra=prompt(pregunta);
            };
            mapa=repeticion(listado);
            do{
                repetido=false;
                for(const palabra1 in listado){
                    for(const palabra2 in listado){
                        if((listado[palabra1]==listado[palabra2])&&(palabra1!=palabra2)){
                            listado.splice(palabra2,1);
                            repetido=true;
                        }
                    }
                }
            }while(repetido);
            console.log(listado);
            console.log(mapa);
            if(listado.length!=0){
                for(const key in listado){
                    document.write("<p>La palabra "+listado[key]+" fué introducida "+mapa.get(listado[key])+" veces.</p>")
                }
            }
            else{
                document.write("<p>No introdujiste ninguna palabra.</p>");
            }
        </script>
    </body>
</html>
