<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <link rel="stylesheet" href="../../webroot/css/fonts.css">
        <link rel="stylesheet" href="../../webroot/css/all.min.css">
        <link rel="stylesheet" href="../../webroot/css/estilos.css">
        <title>Estructura de datos</title>
        <style>
            *{
                box-sizing:border-box;
                margin:0;
                padding:0;
            }
            body{
                & nav{
                    display:flex;
                    width:100dvw;
                    height:4vh;
                    margin-top:10dvh;
                    align-items:center;
                    justify-content:center;
                    gap:5dvw;
                    & input{
                        width:10%;
                        height:100%;
                        background-color:#1e5631;
                        color:white;
                        border-radius:10px;
                        font-weight:900;
                    }
                    & input:hover{
                        cursor:pointer;
                    }
                }
                & h2:nth-of-type(1){
                    position:absolute;
                    left:50%;
                    bottom:57dvh;
                    transform:translate(-50%,0%);
                }
                & #Imagen{
                    position:absolute;
                    width:70dvw;
                    height:12dvh;
                    left:50%;
                    bottom:63dvh;
                    border:2px solid black;
                    border-radius:10px;
                    transform:translate(-50%,0%);
                    & #tablaImagen{
                        display:grid;
                        grid-template-rows:repeat(2,1fr);
                        position:absolute;
                        width:90%;
                        height:15%;
                        top:10%;
                        left:50%;
                        transform:translate(-50%,0%);
                        font-size:1.3rem;
                        & #trPosicion,& #trValor{
                            display:flex;
                            align-items:center;
                            & p{
                                width:6dvw;
                                border:1px solid black;
                                padding-top:1dvh;
                                padding-bottom:1dvh;
                                text-align:center;
                                font-weight:700;
                            }
                            & .celda{
                                display:flex;
                                width:6dvw;
                                padding-top:1dvh;
                                padding-right:2dvw;
                                padding-left:2dvw;
                                padding-bottom:1dvh;
                                border:1px solid black;
                                align-items:center;
                                justify-content:center;
                                overflow:hidden;
                            }
                        }
                    }
                }
                & #Salida{
                    position:absolute;
                    width:70dvw;
                    height:12dvh;
                    left:50%;
                    bottom:44dvh;
                    border:2px solid black;
                    border-radius:10px;
                    transform:translate(-50%,0%);
                }
                & #Pregunta{
                    position:absolute;
                    width:20dvw;
                    height:20dvh;
                    background-color:#F7DF1E;
                    border:1px solid black;
                    padding-top:20px;
                    top:50%;
                    left:50%;
                    border-radius:10px;
                    text-align:center;
                    font-weight:700;
                    font-size:1.3rem;
                    transform:translate(-50%,-50%);
                    & #Datos{
                        position:absolute;
                        width:80%;
                        height:18%;
                        top:40%;
                        left:50%;
                        border-radius:10px;
                        font-size:1.2rem;
                        transform:translate(-50%,-50%);
                    }
                    & #Continuar{
                        position:absolute;
                        width:60%;
                        height:18%;
                        background-color:lime;
                        top:75%;
                        left:50%;
                        border-radius:10px;
                        transform:translate(-50%,0%);
                    }
                    & #Error{
                        position:absolute;
                        width:100%;
                        color:red;
                        top:55%;
                        left:50%;
                        transform:translate(-50%,0%);
                    }
                }
                #tablaBotones{
                    position:absolute;
                    width:50dvw;
                    height:30dvh;
                    top:57%;
                    left:50%;
                    transform:translate(-50%,0%);
                    & #Botones{
                        width:50dvw;
                        & input{
                            height:100%;
                            border-radius:10px;
                        }
                        & .Obligatorio{
                            background-color:yellow;
                        }
                        & .Opcional{
                            background-color:white;
                        }
                        & .Error{
                            display:flex;
                            width:30%;
                            color:red;
                            background-color:green;
                            align-items:center;
                            justify-content:left;
                        }
                    }
                }
                .Invisible{
                    display:none;
                }
                .Visible{
                    display:block;
                }
                .Boton{
                    width:100%;
                    height:100%;
                    background-color:#1e5631;
                    color:white;
                    border-radius:10px;
                    font-weight:900;
                }
                .Boton:hover{
                    cursor:pointer;
                }
            }
        </style>
    </head>
    <body id="Cuerpo">
        <header class="cabecera-principal">
            <div class="contenido-cabecera">
                <div class="identidad">
                    <div class="logo-iniciales">ÓS</div>
                    <h1>Óscar Pozuelo Villamandos</h1>
                </div>  
                <div class="curso-badge">
                    DWEC
                </div>
            </div>
        </header>
        <nav>
            <input type="button" value="ARRAYS" id="Arrays">
            <input type="button" value="CONJUNTOS" id="Conjuntos">
            <input type="button" value="MAPAS" id="Mapas">
        </nav>
        <div id="Imagen" class="Invisible">
            <div id="tablaImagen">
                <div id="trPosicion">
                    <p>POSICIÓN</p>
                </div>
                <div id="trValor">
                    <p>VALOR</p>
                </div>
            </div>
        </div>
        <h2 class="Invisible">SALIDA:</h2>
        <div id="Salida" class="Invisible"></div>
        <table id="tablaBotones">
            <tbody id="Botones"></tbody>
        </table>
        <footer class="pie-pagina">
            <div class="contenido-footer">
                <div class="texto-legal">
                    <p>2025-26 IES LOS SAUCES. ©Todos los derechos reservados.</p>
                    <p class="autor"><a href="https://oscarpozvil.ieslossauces.es">Óscar Pozuelo Villamandos.</a> Fecha de Actualización: 23-02-2026</p>
                </div>
                <div class="iconos-footer">
                    <a href="https://github.com/SrPozuelo/OPVDWECProyectoDWEC" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="../../indexProyectoDWEC.html" title="Inicio"><i class="fa-solid fa-house"></i></a> 
                </div>
            </div>
        </footer>
        <script>
            function BorrarInput(name){
                for(input of document.getElementsByName(name)){
                    input.value="";
                }
            }
            function accionPush(){
                inputs=document.getElementsByName("PUSH")[0].value;
                let correcto=true,mensaje;
                if(inputs=="" && correcto){
                    correcto=false;
                    mensaje="No debes dejar los campos en amarillo vacios.";
                }
                if(!correcto){

                }
                else{
                    Arrai.push(inputs);
                    DibujarArray();
                    BorrarInput("PUSH");
                }
            }
            function accionPop(){
                Arrai.pop();
                DibujarArray();
            }
            function accionShift(){
                Arrai.shift();
                DibujarArray();
            }
            function accionUnshift(){
                inputs=document.getElementsByName("UNSHIFT")[0].value;
                Arrai.unshift(inputs);
                DibujarArray();
                BorrarInput("UNSHIFT");
            }
            function accionIncludes(){}
            function accionReverse(){}
            function accionSlice(){}
            function accionSplice(){}
            function DibujarArray(){
                const trPosicion=document.getElementById("trPosicion");
                const trValor=document.getElementById("trValor");
                trPosicion.innerHTML="<p>POSICIÓN</p>";
                trValor.innerHTML="<p>VALOR</p>";
                let posicion;
                for(let i=0;i<Arrai.length;i++){
                    posicion=document.createElement("div");
                    posicion.setAttribute("class","celda");
                    posicion.textContent=i;
                    trPosicion.appendChild(posicion);
                }
                for(let i=0;i<Arrai.length;i++){
                    posicion=document.createElement("div");
                    posicion.setAttribute("class","celda");
                    posicion.textContent=Arrai[i];
                    trValor.appendChild(posicion);
                }
            }
            function PeticionDeDatos(pregunta,estructura){
                const Cuerpo=document.getElementById("Cuerpo");
                const div=document.createElement("div");
                let input=document.createElement("input");
                div.textContent=pregunta;
                div.setAttribute("id","Pregunta");
                input.setAttribute("type","text");
                input.setAttribute("id","Datos");
                div.appendChild(input);
                input=document.createElement("input");
                input.setAttribute("type","button");
                input.setAttribute("value","CONTINUAR");
                input.setAttribute("id","Continuar");
                input.addEventListener("click",()=>{
                    if((document.getElementById("Datos").value)==""){
                        if(document.getElementById("Error")!=null){
                            Cuerpo.removeChild(input);
                        }
                        input=document.createElement("p");
                        input.setAttribute("id","Error");
                        input.textContent="No debes dejar el campo vacio.";
                        div.appendChild(input);                 
                    }
                    else{
                        switch(estructura){
                            case "Array":
                                Arrai.push(document.getElementById("Datos").value);
                                Cuerpo.removeChild(div);
                                Imagen.setAttribute("class","Visible");
                                Salida.setAttribute("class","Visible");
                                document.getElementsByTagName("h2")[0].setAttribute("class","Visible");
                                DibujarArray();
                                let Nombres=[
                                    ["PUSH"    ,1,accionPush    ,[true]             ],
                                    ["POP"     ,0,accionPop     ,[]                 ],
                                    ["SHIFT"   ,0,accionShift   ,[]                 ],
                                    ["UNSHIFT" ,1,accionUnshift ,[true]             ],
                                    ["INCLUDES",2,accionIncludes,[true ,false]      ],
                                    ["REVERSE" ,0,accionReverse ,[]                 ],
                                    ["SLICE"   ,2,accionSlice   ,[false,false]      ],
                                    ["SPLICE"  ,3,accionSplice  ,[true ,false,false]]
                                ];
                                let bot,tr,input,td;
                                for(metodo of Nombres){
                                    tr=document.createElement("tr");
                                    td=document.createElement("td");
                                    bot=document.createElement("button");
                                    bot.setAttribute("id",metodo[0]);
                                    bot.textContent=metodo[0];
                                    bot.setAttribute("class","Boton");
                                    td.setAttribute("class","Error");
                                    tr.appendChild(td);
                                    td=document.createElement("td");
                                    td.appendChild(bot);
                                    tr.appendChild(td);
                                    for(let i=0;i<metodo[1];i++){
                                        td=document.createElement("td");
                                        input=document.createElement("input");
                                        input.type="text";
                                        input.name=metodo[0];
                                        td.appendChild(input);
                                        tr.appendChild(td);
                                    }
                                    Botones.appendChild(tr);
                                    let cont=0;
                                    for(inp of document.getElementsByName(metodo[0])){
                                        if(metodo[3][cont]){
                                            inp.setAttribute("class","Obligatorio");
                                        }
                                        else{
                                            inp.setAttribute("class","Opcional");
                                        }
                                        cont=cont+1;
                                    }
                                    document.getElementById(metodo[0]).addEventListener("click",metodo[2]);
                                }
                            break;
                            case "Conjunto":break;
                            case "Mapa":break;
                        }
                    }
                });
                div.appendChild(input);
                Cuerpo.appendChild(div);
            }
            const Arrays=document.getElementById("Arrays");
            const Conjuntos=document.getElementById("Conjuntos");
            const Mapas=document.getElementById("Mapas");
            const Imagen=document.getElementById("Imagen");
            const Botones=document.getElementById("Botones");
            const Salida=document.getElementById("Salida");
            var boton=true;
            var Arrai=new Array();
            var Conjunto=new Set();
            var Mapa=new Map();
            Arrays.addEventListener("click",()=>{
                if(boton){
                    boton=false;
                    PeticionDeDatos("Introduzca el primer valor del Array:","Array");
                    console.log(Arrai);
                }
            });
            Conjuntos.addEventListener("click",()=>{
                if(boton){
                    boton=false;
                }
            });
            Mapas.addEventListener("click",()=>{
                if(boton){
                    boton=false;
                }
            });
        </script>
    </body>
</html>
